name: weather_crunch_cron
on:
  schedule:
    # runs 4x daily at 7am, 12pm, 7pm, 12am CDT
    - cron: '0 0,5,12,17 * * *'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  daily:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'
          cache: 'pip'
      - name: Install Python dependencies
        run: pip install -r requirements.txt
      - name: Weather API ETL
        env:
          API_KEY: ${{ secrets.WEATHER_KEY }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: python3 src/load.py
